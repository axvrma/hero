<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Request content rebuild | Abhishek Verma</title>
    <link rel="icon" href="/favicon.svg" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <main class="admin-shell">
      <a class="wordmark" href="/">Abhishek Verma</a>
      <h1>Publish your thinking.</h1>
      <p>
        Request a Netlify rebuild using the latest Notion content. A successful
        request starts a build; Netlify reports the final result.
      </p>
      <form id="sync-form">
        <div class="form-group">
          <label for="api-secret">Administrator secret</label
          ><input
            id="api-secret"
            type="password"
            required
            minlength="32"
            autocomplete="off"
          />
        </div>
        <button class="button button-primary" type="submit">
          Request rebuild →
        </button>
      </form>
      <p
        class="admin-status"
        id="sync-status"
        role="status"
        aria-live="polite"
      ></p>
      <p><a class="text-link" href="/">← Back to portfolio</a></p>
    </main>
    <script type="module" src="/src/sync.js"></script>
  </body>
</html>

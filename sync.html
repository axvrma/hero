<!doctype html>
<html lang="en" class="lenis lenis-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sync Portfolio | Abhishek Verma</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
      .sync-container {
        max-width: 500px;
        margin: 100px auto;
        padding: 40px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        text-align: center;
      }
      .form-group {
        margin-bottom: 24px;
        text-align: left;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-secondary);
        font-size: 0.9rem;
      }
      .form-group input {
        width: 100%;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        font-family: inherit;
        outline: none;
        transition: border-color 0.3s ease;
      }
      .form-group input:focus {
        border-color: var(--google-blue);
      }
      .btn-sync {
        width: 100%;
        padding: 14px;
        background: #4285f4; /* Hardcoded Google Blue */
        color: #ffffff; /* White text */
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
      }
      .btn-sync:hover {
        background: #3367d6;
        transform: translateY(-2px);
      }
      .btn-sync:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
      
      /* Loader styles */
      .loader-wrapper {
        display: none;
        margin-top: 30px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 16px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: var(--google-blue);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .status-text {
        color: var(--text-secondary);
        font-size: 0.95rem;
        margin-bottom: 12px;
      }
      .progress-bar {
        width: 100%;
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--google-blue);
        transition: width 0.5s ease;
      }
      
      .success-message, .error-message {
        display: none;
        margin-top: 24px;
        padding: 16px;
        border-radius: 12px;
        font-size: 0.95rem;
      }
      .success-message {
        background: rgba(52, 168, 83, 0.1);
        border: 1px solid rgba(52, 168, 83, 0.3);
        color: #81c995;
      }
      .error-message {
        background: rgba(234, 67, 53, 0.1);
        border: 1px solid rgba(234, 67, 53, 0.3);
        color: #f28b82;
      }
    </style>
  </head>
  <body class="bg-black text-white antialiased">
    <div id="app">
      <div class="fixed inset-0 pointer-events-none z-0">
        <div class="glow-orb top-left"></div>
      </div>
      
      <div class="sync-container relative z-10">
        <h1 class="text-3xl font-bold mb-2">Automated Sync</h1>
        <p class="text-secondary mb-8">Trigger the AI to pull your latest Resume and GitHub projects into Notion.</p>
        
        <div class="form-group">
          <label>API Secret Token</label>
          <input type="password" id="secretInput" placeholder="Enter your secret...">
        </div>
        
        <button id="syncBtn" class="btn-sync">Start AI Sync</button>
        
        <div class="loader-wrapper" id="loaderWrapper">
          <div class="spinner"></div>
          <div class="status-text" id="statusText">Initiating Background Task...</div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
        
        <div class="success-message" id="successMessage">
          ✅ <strong>Sync Triggered Successfully!</strong><br><br>
          The AI is running securely in the background. It takes about ~45 seconds for Gemini to parse your PDF and push it to Notion.
        </div>
        
        <div class="error-message" id="errorMessage"></div>
      </div>
    </div>

    <script>
      const syncBtn = document.getElementById('syncBtn');
      const secretInput = document.getElementById('secretInput');
      const loaderWrapper = document.getElementById('loaderWrapper');
      const statusText = document.getElementById('statusText');
      const progressFill = document.getElementById('progressFill');
      const successMessage = document.getElementById('successMessage');
      const errorMessage = document.getElementById('errorMessage');

      // Helper for simulated progress
      const stages = [
        { time: 0, text: "Downloading Resume from Google Drive...", progress: 10 },
        { time: 5000, text: "Gemini AI is parsing the PDF...", progress: 30 },
        { time: 18000, text: "Extracting structured JSON...", progress: 50 },
        { time: 25000, text: "Clearing existing Notion databases...", progress: 65 },
        { time: 30000, text: "Pushing fresh data to Notion...", progress: 80 },
        { time: 38000, text: "Fetching Repositories from GitHub...", progress: 95 },
        { time: 42000, text: "Sync Complete!", progress: 100 }
      ];

      syncBtn.addEventListener('click', async () => {
        const secret = secretInput.value.trim();
        if (!secret) return alert("Please enter your secret token");
        
        // Reset UI
        syncBtn.disabled = true;
        loaderWrapper.style.display = 'block';
        successMessage.style.display = 'none';
        errorMessage.style.display = 'none';
        progressFill.style.width = '0%';
        
        try {
          // Trigger the background function
          const response = await fetch(`/api/sync-notion-background?secret=${encodeURIComponent(secret)}`, {
            method: 'POST'
          });
          
          if (!response.ok) {
            throw new Error(`Authentication failed. Did you type the correct secret?`);
          }

          // Since it's a background function, it returns 202 Accepted immediately.
          // We will simulate the progress for the user so they know it's working.
          stages.forEach(stage => {
            setTimeout(() => {
              statusText.textContent = stage.text;
              progressFill.style.width = stage.progress + '%';
              
              if (stage.progress === 100) {
                setTimeout(() => {
                  loaderWrapper.style.display = 'none';
                  successMessage.style.display = 'block';
                  syncBtn.disabled = false;
                  secretInput.value = '';
                }, 1000);
              }
            }, stage.time);
          });

        } catch (error) {
          loaderWrapper.style.display = 'none';
          errorMessage.style.display = 'block';
          errorMessage.innerHTML = `❌ <strong>Error:</strong> ${error.message}`;
          syncBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
